name: Debug meal scraper

# 학식 0건 원인 진단용(임시). 생협 페이지가 Actions 러너에 실제로 무엇을
# 돌려주는지(상태코드·리다이렉트·테이블 구조)를 로그에 남긴다.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/debug-meal.yml", "scrapers/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scrapers/requirements.txt
      - name: Runner egress info
        run: |
          curl -sS -m 10 https://ipinfo.io/json || true
          echo; TZ=Asia/Seoul date
      - name: Raw HTTP probe
        run: |
          for shop in 35 36 46; do
            echo "===== shop $shop ====="
            curl -sS -m 20 -L -o "page_$shop.html" -D - \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36" \
              -w "\nFINAL_URL=%{url_effective} STATUS=%{http_code} SIZE=%{size_download}\n" \
              "https://coop.knu.ac.kr/sub03/sub01_01.html?shop_sqno=$shop" || true
          done
      - name: Inspect HTML structure
        run: |
          python - <<'EOF'
          import re
          from bs4 import BeautifulSoup
          for shop in (35, 36, 46):
              raw = open(f"page_{shop}.html", "rb").read()
              print(f"\n######## shop {shop}: {len(raw)} bytes")
              for enc in ("utf-8", "euc-kr"):
                  try:
                      html = raw.decode(enc); print("decoded as", enc); break
                  except UnicodeDecodeError:
                      continue
              else:
                  html = raw.decode("utf-8", "replace")
              soup = BeautifulSoup(html, "html.parser")
              print("TITLE:", soup.title.get_text(strip=True) if soup.title else None)
              low = html.lower()
              print("login/sso hints:", [k for k in ("sso", "login", "로그인", "captcha", "cloudflare", "access denied") if k in low])
              tables = soup.find_all("table")
              print("TABLE COUNT:", len(tables))
              for i, t in enumerate(tables):
                  txt = re.sub(r"\s+", " ", t.get_text(" ", strip=True))
                  rows = t.find_all("tr")
                  print(f"--- table {i}: class={t.get('class')} caption={t.caption.get_text(strip=True) if t.caption else None}")
                  print("    head60:", txt[:60])
                  print("    row cell counts:", [len(r.find_all(['td', 'th'])) for r in rows][:8])
                  for r in rows[:3]:
                      print("    ROW:", [re.sub(r'\s+', ' ', c.get_text(' ', strip=True))[:50] for c in r.find_all(['td', 'th'])])
              if not tables:
                  body = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
                  print("BODY TEXT (first 1500):", body[:1500])
              print("RAW HEAD (first 1500 chars):"); print(html[:1500])
          EOF
      - name: Current scraper output
        run: python scrapers/knu_meal_scraper.py --shop 35 --json || true
      - uses: actions/upload-artifact@v4
        with:
          name: meal-pages
          path: page_*.html
