name: Debug meal scraper

# 학식 0건 원인 진단용(임시). 생협 페이지가 Actions 러너에 실제로 무엇을
# 돌려주는지(상태코드·리다이렉트·테이블 구조)를 로그에 남긴다.

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/debug-meal.yml", "scrapers/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scrapers/requirements.txt
      - name: Runner egress info
        run: |
          curl -sS -m 10 https://ipinfo.io/json || true
          echo; TZ=Asia/Seoul date
      - name: Probe alternative meal sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for u in \
            "http://coop.knu.ac.kr/sub03/sub01_01.html?shop_sqno=35" \
            "https://www.knu.ac.kr/wbbs/wbbs/main/main.action" \
            "https://dorm.knu.ac.kr/" \
            "https://dorm.knu.ac.kr/_new_ver/newlife/05.php" \
            "https://dorm.knu.ac.kr/scdorm/_new_ver/newlife/05.php" ; do
            echo "===== $u"
            curl -sS -m 20 -L -A "$UA" -o probe.html \
              -w "FINAL_URL=%{url_effective} STATUS=%{http_code} SIZE=%{size_download}\n" "$u" || true
            python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          raw = open("probe.html", "rb").read()
          html = None
          for enc in ("utf-8", "euc-kr"):
              try:
                  html = raw.decode(enc); break
              except UnicodeDecodeError:
                  pass
          html = html or raw.decode("utf-8", "replace")
          soup = BeautifulSoup(html, "html.parser")
          print("TITLE:", soup.title.get_text(strip=True) if soup.title else None, "| tables:", len(soup.find_all("table")))
          seen = set()
          for a in soup.find_all("a", href=True):
              t = re.sub(r"\s+", " ", a.get_text(" ", strip=True))
              if re.search(r"식단|식당|메뉴|학식", t) and (t, a["href"]) not in seen:
                  seen.add((t, a["href"])); print("  LINK:", t[:30], "->", a["href"][:150])
          body = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
          for m in re.finditer(r"(조식|중식|석식)", body):
              print("  MEAL CTX:", body[max(0, m.start()-40):m.start()+120]); break
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: meal-pages
          path: probe.html
          if-no-files-found: ignore
