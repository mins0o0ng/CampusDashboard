name: Debug meal HTML (archive)

# 임시: 해외 IP 로는 생협 페이지가 차단되므로 Wayback Machine 스냅샷으로
# 실제 식단표 HTML 구조를 확인한다(붙여넣기 파서 검증용).

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/debug-meal.yml"]

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - run: pip install beautifulsoup4 requests
      - name: Fetch wayback snapshots
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          cdx = requests.get("http://web.archive.org/cdx/search/cdx", params={
              "url": "coop.knu.ac.kr/sub03/sub01_01.html", "matchType": "prefix",
              "output": "json", "filter": "statuscode:200", "limit": "-15"}, timeout=60).json()
          print("snapshots:", [(r[1], r[2]) for r in cdx[1:]])
          for row in reversed(cdx[1:]):
              ts, orig = row[1], row[2]
              html = requests.get(f"http://web.archive.org/web/{ts}id_/{orig}", timeout=60).content
              for enc in ("utf-8", "euc-kr"):
                  try:
                      text = html.decode(enc); break
                  except UnicodeDecodeError:
                      pass
              soup = BeautifulSoup(text, "html.parser")
              tables = soup.find_all("table")
              if not tables:
                  continue
              print("\n######## USING", ts, orig, "tables:", len(tables))
              # 식단표 주변 구조(날짜 표기 포함)를 그대로 출력
              for i, t in enumerate(tables[:4]):
                  print(f"\n----- TABLE {i} (prev heading: {t.find_previous(['h1','h2','h3','h4','strong','p','caption']).get_text(' ', strip=True)[:60] if t.find_previous(['h1','h2','h3','h4','strong','p']) else None})")
                  s = str(t)
                  s = re.sub(r"\s+", " ", s)
                  print(s[:3500])
              body = re.sub(r"\s+", " ", soup.get_text(" ", strip=True))
              for m in re.finditer(r"20\d\d[.\-/]\s?\d{1,2}[.\-/]\s?\d{1,2}", body):
                  print("DATE CTX:", body[max(0, m.start()-60):m.end()+60]); 
              break
          PY
