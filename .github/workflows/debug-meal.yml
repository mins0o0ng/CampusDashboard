name: Debug meal HTML (archive)

# 임시: 해외 IP 로는 생협 페이지가 차단되므로 Wayback Machine 스냅샷으로
# 실제 식단표 HTML 구조를 확인한다(붙여넣기 파서 검증용).

on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/debug-meal.yml"]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 requests
      - name: Fetch wayback snapshots
        run: |
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          cdx = requests.get("http://web.archive.org/cdx/search/cdx", params={
              "url": "coop.knu.ac.kr/sub03/sub01_01.html", "matchType": "prefix",
              "output": "json", "filter": "statuscode:200", "limit": "-15"}, timeout=60).json()
          print("snapshots:", [(r[1], r[2]) for r in cdx[1:]])
          for row in reversed(cdx[1:]):
              ts, orig = row[1], row[2]
              html = requests.get(f"http://web.archive.org/web/{ts}id_/{orig}", timeout=60).content
              for enc in ("utf-8", "euc-kr"):
                  try:
                      text = html.decode(enc); break
                  except UnicodeDecodeError:
                      pass
              soup = BeautifulSoup(text, "html.parser")
              tables = soup.find_all("table")
              if not tables:
                  continue
              import os
              os.makedirs("scrapers/fixtures", exist_ok=True)
              open("scrapers/fixtures/coop_meal_sample.html", "wb").write(html)
              print("saved", ts, orig, len(html))
              break
          PY
      - name: Commit fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scrapers/fixtures
          git commit -m "test: add archived coop meal page fixture (Wayback)" && git push || echo "no change"
