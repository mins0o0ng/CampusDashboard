name: Deploy to GitHub Pages

# 실제 React 앱(Vite 빌드)을 GitHub Pages 로 배포.
# 데이터는 scrape.yml 이 커밋한 public/data 를 그대로 사용한다.
# (scrape.yml 이 끝나면 workflow_run 으로 자동 재배포 — 봇 커밋은 [skip ci] 라 push 로는 안 뜸)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Scrape KNU data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # workflow_run 시 수집 커밋이 반영된 최신 main 을 빌드

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build app
        # Supabase 연결(투표 공유): 저장소 Settings → Secrets and variables → Actions → Variables 에
        # SUPABASE_URL, SUPABASE_ANON_KEY 를 넣으면 켜진다. 없으면 브라우저 저장 모드로 빌드된다.
        # anon 키는 공개용 키라 Variables(비밀 아님)에 둬도 된다 — 권한은 DB 의 RLS·함수가 막는다.
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
